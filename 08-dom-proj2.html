<!DOCTYPE html>
<html>

<head>
  <title>Project #2</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .title {
      font-size: 30px;
      font-weight: bold;
    }

    .game-selection {
      background-color: transparent;
      border: 5px solid white;
      width: 120px;
      height: 120px;
      border-radius: 60px;
      margin-right: 5px;
      cursor: pointer;
    }

    .game-selection img {
      height: 50px;
      border: none;
      background-color: black;
    }
  </style>
</head>

<body>
  <p class="title">Rock Paper Scissors</p>

  <button class="game-selection" id="js-rock-button" onclick="handleSubscribeButton('r')">
    <img src="./public/rock-emoji.png">
  </button>
  <button class="game-selection" id="js-paper-button" onclick="handleSubscribeButton('p')">
    <img src="./public/paper-emoji.png">
  </button>
  <button class="game-selection" id="js-scissors-button" onclick="handleSubscribeButton('s')">
    <img src="./public/scissors-emoji.png">
  </button>
  <p>Score:</p>
  <div class="score"></div>
  <script>
    const score = JSON.parse(localStorage.getItem("js-score")) || {
      w: 0,
      l: 0,
      t: 0
    }

    const scoreElement = document.querySelector(".score");
    scoreElement.innerHTML = `Wins: ${score.w}, Loses: ${score.l}, Ties: ${score.t}`;

    function handleSubscribeButton(humanSelected) {

      const random = Math.random();
      let computerSelected = ''
      if (random > 0 && random < 0.33) {
        computerSelected = "r";
      } else if (random > 0.33 && random < 0.66) {
        computerSelected = "p";
      } else {
        computerSelected = "s";
      }
      checkAndUpdateScore(humanSelected, computerSelected)
    }

    function checkAndUpdateScore(humanSelected, computerSelected) {
      console.log("checkAndUpdateScore start.", humanSelected, computerSelected)
      if (humanSelected === computerSelected) {
        score.t++;
      } else {
        if (humanSelected === "r" && computerSelected === "s") {
          console.log("human win!");
          score.w++;
        } else if (humanSelected === "p" && computerSelected === "r") {
          console.log("human win!");
          score.w++;
        } else if (humanSelected === "s" && computerSelected === "p") {
          console.log("human win!");
          score.w++;
        } else {
          console.log("human lost!!! :)");
          score.l++
        }
      }
      localStorage.setItem("js-score", JSON.stringify(score));
      scoreElement.innerHTML = `Wins: ${score.w}, Loses: ${score.l}, Ties: ${score.t}`;
    }
  </script>
</body>

</html>
